# ScopeFlow Example MVC Application
server.port=8080

# ScopeFlow Configuration
scopeflow.enabled=true
scopeflow.mdc.enabled=true
# Propagate all keys to MDC (default when keys is empty)
# scopeflow.mdc.keys=request.id,customer.id,product,order.id
# scopeflow.mdc.prefix=

# HTTP scope
scopeflow.http.server.generate-request-scope=true
scopeflow.http.server.generate-request-id=true
scopeflow.http.server.request-id-header=X-Request-ID

# Virtual threads (Spring Boot 3.2+)
spring.threads.virtual.enabled=true
